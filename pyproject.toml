[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jira-tempo-mcp"
version = "0.4.0"
description = "MCP server for self-hosted Jira + Tempo Timesheets: track time, list worklogs, generate weekly reports."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Korrnals" }]
keywords = ["mcp", "jira", "tempo", "timesheets", "worklog", "report"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "pytz>=2024.1",
    "jinja2>=3.1",  # template engine (v0.2.0)
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-pytz>=2024.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pre-commit>=3.6.0",
]

[project.scripts]
jira-tempo-mcp = "jira_tempo_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Ship install.py as package data in the wheel. install.py lives at the project
# root (used by editable installs); build_helpers.py copies it into the package
# dir at build time so wheel installs can resolve it via
# importlib.resources.files(__package__) / "install.py" (see cli._run_install_script).
[tool.setuptools.package-data]
jira_tempo_mcp = ["install.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]

# E501 ignored: long Russian strings (report templates) cannot wrap without breaking
# readability of generated report content; line-length=100 still enforced by ruff format.
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]