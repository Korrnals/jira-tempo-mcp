name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # create GitHub Release + upload asset
  packages: write   # push image to ghcr.io

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-wheel:
    name: Build wheel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tool
        run: pip install --no-cache-dir build

      - name: Build wheel + sdist
        run: python -m build --outdir dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14

  # PyPI publish via Trusted Publishing (OIDC) — no API token.
  # Setup: https://pypi.org/manage/account/publishing/ — add a GitHub publisher:
  #   owner=Korrnals, repo=jira-tempo-mcp, workflow=release.yml, environment=pypi
  # First release may use an API token if trusted publishing is not yet configured.
  #
  # DISABLED: PyPI trusted publishing not yet configured ("пока не выходим на PyPI").
  # To enable:
  #   1. Create "pypi" environment in repo Settings → Environments
  #   2. Configure OIDC trusted publishing on PyPI
  #   3. Change `if: false` → `if: true` below
  pypi-publish:
    name: Publish to PyPI
    needs: build-wheel
    runs-on: ubuntu-latest
    if: false  # Enable when PyPI trusted publishing is configured
    permissions:
      id-token: write  # trusted publishing (OIDC)
    environment:
      name: pypi
      url: https://pypi.org/project/jira-tempo-mcp/
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

  docker:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    needs: build-wheel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/korrnals/jira-tempo-mcp
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: Create GitHub Release
    needs: build-wheel
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
