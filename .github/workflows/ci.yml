name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    name: Lint + Type check + Tests
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install package with dev deps
        run: pip install ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ install.py tests/

      - name: Format check (ruff)
        run: ruff format --check src/ install.py tests/

      - name: Type check (mypy)
        run: mypy src/

      - name: Tests (pytest)
        run: pytest tests/ -v