<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="jira-tempo-mcp banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1B33"/>
      <stop offset="100%" stop-color="#0052CC"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF5630"/>
      <stop offset="100%" stop-color="#FFAB00"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <!-- decorative grid -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <path d="M0 75 H1200 M0 150 H1200 M0 225 H1200"/>
    <path d="M300 0 V300 M600 0 V300 M900 0 V300"/>
  </g>
  <!-- accent bar -->
  <rect x="80" y="90" width="8" height="120" rx="4" fill="url(#accent)" filter="url(#shadow)"/>
  <!-- title -->
  <text x="112" y="150" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="700" fill="#FFFFFF" filter="url(#shadow)">jira-tempo-mcp</text>
  <!-- subtitle -->
  <text x="114" y="200" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="400" fill="#B3D1FF">MCP server for Jira + Tempo Timesheets</text>
  <!-- badges row -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600">
    <rect x="114" y="232" width="150" height="30" rx="15" fill="#FFFFFF" opacity="0.12"/>
    <text x="189" y="252" text-anchor="middle" fill="#FFFFFF">Python 3.11+</text>
    <rect x="276" y="232" width="90" height="30" rx="15" fill="#FFFFFF" opacity="0.12"/>
    <text x="321" y="252" text-anchor="middle" fill="#FFFFFF">MIT</text>
    <rect x="378" y="232" width="70" height="30" rx="15" fill="#2684FF" opacity="0.9"/>
    <text x="413" y="252" text-anchor="middle" fill="#FFFFFF">MCP</text>
  </g>
  <!-- right-side glyph: stylized clock + issue key -->
  <g transform="translate(960 150)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="70" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.85"/>
    <path d="M0 -50 V0 L40 20" fill="none" stroke="#FFAB00" stroke-width="8" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="6" fill="#FFFFFF"/>
  </g>
</svg>
